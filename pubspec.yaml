name: paisa_mitra
description: Paisa Mitra - personal expense, income and budget manager.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  intl: 0.19.0
  sqflite: 2.3.3+1
  provider: 6.1.2
  path: ^1.9.1
  fl_chart: 0.68.0
  random_color: 1.0.6-nullsafety
  url_launcher: 6.3.1
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  file_picker: ^8.1.4
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#2C7E8A"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/waiting.png
    - assets/images/app_icon.png
    - assets/images/app_logo.png
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
        - asset: assets/fonts/Quicksand-Medium.ttf
        - asset: assets/fonts/Quicksand-Light.ttf
          weight: 700
